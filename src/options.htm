<!DOCTYPE html>
<html>

<head>
    <title>Wizmage Options</title>
    <link rel="stylesheet" href="options.css">
</head>

<body>
    <div id='cont'>
        <h3>Settings</h3>
        <div id="phone-w">
            <h2>Phone Number</h2>
            <div id="phone-t">
                <span id="phone-t-t"></span>
                <a id="phone-t-set">set</a>
            </div>
        </div>
        <div id="unwanted-w">
            <h2>Block any image that contains:</h2>
            <select id="unwanted-opt">
                <option value=""></option>
                <option value="cust">(custom)</option>
            </select>
            <input id="unwanted-cust" maxlength="40" />
        </div>
        <div>
            <input type="checkbox" id="noEye" />
            <label for="noEye">Don't show the Eye in hidden images</label>
            <span id="noEyeInfo" class="info-icon"
                title="By default, an eye is shown when hovering the mouse over a hidden image. Clicking on it will show that image.">?</span>
        </div>
        <div>
            <label>Maximum Safe pixels</label>
            <input type="text" id="max-safe" />
            <span class="info-icon"
                title="The maximum size of images that you always want shown. Must be 1-1000.">?</span>
        </div>
        <div>
            <input type="checkbox" id="close-on-click" />
            <label for="close-on-click">Menu - close on click</label>
            <span class="info-icon" title="Closes the popup menu, whenever an option is clicked.">?</span>
        </div>
        <h3>
            <input type="radio" id="white-list" name="list-type" />
            <label for="white-list">White List</label>
            <input type="radio" id="black-list" name="list-type" />
            <label for="black-list">Black List</label>
            <span class="info-icon"
                title="With a White List, Wizmage runs on all sites, besides for those in the list below. With a Black List, Wizmage only runs on the sites in the list below.">?</span>
        </h3>
        <form id="form">
            <input type='text' id='addName'>
            <input type='submit' value='Add Exception' id='addBut'>
        </form>
        <div><i>a URL containing any of the following lines will be matched</i></div>
        <div id='list'></div>
        <div>
            <input type="checkbox" id="free-text" />
            <label for="free-text">Free Text</label>
        </div>
    </div>
    <script src='options.js'></script>
</body>

</html>
